    <!-- Fetch property setter safeguard for sandboxed iframe environments -->
    <script>
      (function() {
        try {
          var nativeFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch || nativeFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            var g = typeof globalThis !== 'undefined' ? globalThis : window;
            var orig = g.fetch ? g.fetch.bind(g) : null;
            var cur = orig;
            Object.defineProperty(g, 'fetch', {
              get: function() { return cur || orig; },
              set: function(fn) { cur = fn; },
              configurable: true,
              enumerable: true
            });
          } catch(e) {}
        }
      })();
    </script>
